<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Assistant Demo</title><style>*{box-sizing:border-box}body{margin:0;font:13px system-ui,Arial,sans-serif;background:#f5faf7;color:#17392c}.head{background:#069a73;color:#fff;padding:17px 18px;font-weight:800;font-size:16px}.head small{display:block;font-size:10px;font-weight:500;opacity:.85;margin-top:4px}.messages{height:355px;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:11px}.bubble{max-width:88%;padding:12px;border-radius:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:white;border:1px solid #e1ece5}.user{align-self:flex-end;background:#d5f8e7}.form{display:flex;gap:6px;padding:10px;border-top:1px solid #e4ece7;background:white}.form input{flex:1;min-width:0;border:1px solid #d7e5dc;border-radius:8px;padding:11px;font:inherit}.form button{border:0;background:#06a77b;color:white;border-radius:8px;padding:0 13px;cursor:pointer}.notice{font-size:10px;color:#728b7f;text-align:center;padding:8px;background:white}</style></head><body><header class="head">✦ Sophia — AI Assistant<small>Demo for <span id="business"></span> · Simulated conversation</small></header><main class="messages" id="messages"><div class="bubble bot">Hi! 👋 Welcome! I'm Sophia, your demo AI sales assistant. What are you looking for today?</div></main><form class="form" id="form"><input id="input" maxlength="400" placeholder="Ask about vehicles, hours, callbacks..." required autocomplete="off"><button>Send</button></form><div class="notice">Demo only • No real messages, calls or appointments</div><script>
const params=new URLSearchParams(location.search),biz=params.get('business')||'Sunshine Auto';document.getElementById('business').textContent=biz.replace(/[-_]/g,' ').slice(0,50);
let stage='',name='';const msgs=document.getElementById('messages');function add(role,text){const d=document.createElement('div');d.className='bubble '+role;d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
document.getElementById('form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('input'),text=input.value.trim();if(!text)return;add('user',text);input.value='';const t=text.toLowerCase();let answer;
if(stage==='name'){name=text.slice(0,60);stage='phone';answer='Thanks, '+name+'! What phone number should our team call?'}
else if(stage==='phone'){if(!/^\+?[\d\s().-]{7,25}$/.test(text)){answer='Please enter a valid contact number.'}else{stage='';answer='Thanks! Your request was noted in this DEMO only. No real callback was scheduled.'}}
else if(/callback|call me|call back|lig(a|ue) pra mim|me liga|retorno/i.test(t)){stage='name';answer='Sure! What name should our team use for your callback?'}
else if(/phone|human|person|representative|telefone|atendente|humano|n[uú]mero/i.test(t)){answer='I can help you request a callback. Please type "callback" to try the demo flow. There is no live phone connection.'}
else if(/suv|car|price|vehicle|vehicle|carro|pre[cç]o|ve[ií]culo/i.test(t)){answer='We have a sample SUV listing at $21,500 in this demonstration. Would you like to request more details or a callback?'}
else if(/hour|open|hor[aá]rio|abr(e|ir)/i.test(t)){answer='Example business hours: Monday–Saturday, 9 AM–6 PM. This is demo information.'}
else{answer='Thanks for reaching out! I can answer sample questions about vehicles, business hours, or callback requests. This is a demo, not connected to a live AI.'}
setTimeout(()=>add('bot',answer),220)};
</script></body></html>
