<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Business assistant • NexusSales AI</title><style>
:root{font:13px system-ui,sans-serif;color:#1b3e30;background:#f7faf7}*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column}.head{background:#087858;color:white;padding:17px;font-weight:800;font-size:15px}.head small{display:block;font-size:11px;font-weight:500;margin-top:5px;color:#d0f5e1}.feed{flex:1;min-height:0;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:11px}.bubble{max-width:90%;padding:12px;border-radius:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:#fff;border:1px solid #e0ebe4}.user{align-self:flex-end;background:#dbf5e6}.form{display:flex;gap:7px;padding:11px;background:white;border-top:1px solid #e5eee8}.form input{flex:1;min-width:0;border:1px solid #d1e2d8;padding:11px;border-radius:8px;font:inherit}.form button{border:0;background:#07a777;border-radius:8px;color:white;font-weight:750;padding:0 14px}.form button:disabled{opacity:.4}.foot{font-size:10px;text-align:center;color:#8da295;padding:8px;background:white}
</style></head><body><header class="head"><span id="business">Business assistant</span><small id="status">Connecting securely…</small></header><main class="feed" id="feed" role="log" aria-live="polite"><div class="bubble bot" id="hello">Checking this assistant…</div></main>
<form class="form" id="form"><input id="message" required maxlength="700" placeholder="Ask about products or services…" disabled autocomplete="off"><button id="send" disabled>Send</button></form><div class="foot">Powered by NexusSales AI • Payments and bookings are not handled in chat</div>
<script>
const botId=new URLSearchParams(location.search).get("bot")||"";
const el=id=>document.getElementById(id),feed=el("feed");let ready=false,history=[],busy=false;
function add(role,text){const b=document.createElement("div");b.className="bubble "+role;b.textContent=String(text).slice(0,2500);feed.appendChild(b);feed.scrollTop=feed.scrollHeight;return b}
async function init(){
 if(!/^bot_[a-z0-9]{20,50}$/.test(botId)){el("hello").textContent="Invalid assistant link.";el("status").textContent="Unavailable";return}
 try{
  const r=await fetch("/.netlify/functions/widget-config?botId="+encodeURIComponent(botId),{cache:"no-store"});
  const data=await r.json();if(!r.ok||data.available!==true)throw Error("Not active");
  el("business").textContent=data.businessName||"Business assistant";
  el("status").textContent="Live AI • Products and services";
  el("hello").textContent=data.greeting||"Hi! How can I help today?";
  ready=true;el("message").disabled=false;el("send").disabled=false;
 }catch{el("status").textContent="Currently unavailable";el("hello").textContent="This assistant is temporarily unavailable. Please contact the business directly."}
}
el("form").onsubmit=async e=>{
 e.preventDefault();if(!ready||busy)return;
 const message=el("message").value.trim();if(!message)return;
 busy=true;el("message").value="";el("message").disabled=true;el("send").disabled=true;
 add("user",message);const pending=add("bot","One moment…");
 try{
  const r=await fetch("/.netlify/functions/store-chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({botId,message,history:history.slice(-8)})});
  const data=await r.json().catch(()=>({}));if(!r.ok||!data.reply)throw Error("Unavailable");
  pending.textContent=data.reply;history.push({role:"user",content:message},{role:"assistant",content:data.reply});history=history.slice(-8);
 }catch{pending.textContent="I can't answer right now. Please contact the business directly."}
 finally{busy=false;el("message").disabled=false;el("send").disabled=false;el("message").focus();feed.scrollTop=feed.scrollHeight}
};
init();
</script></body></html>
