<!doctype html><html lang="en"><head><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><link rel="shortcut icon" href="/assets/favicon.svg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Business assistant • NexusSales AI</title><style>
:root{font:13px system-ui,sans-serif;color:#1b3e30;background:#f7faf7}*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column}.head{background:#087858;color:white;padding:17px;font-weight:800;font-size:15px}.head small{display:block;font-size:11px;font-weight:500;margin-top:5px;color:#d0f5e1}.feed{flex:1 1 auto;min-height:150px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:15px;display:flex;flex-direction:column;align-items:stretch;gap:11px}.feed{min-height:0;overflow-y:auto}.bubble{flex:0 0 auto;min-height:max-content;min-width:0;max-width:90%;height:auto;padding:12px;border-radius:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal}.bot{align-self:flex-start;background:#fff;border:1px solid #e0ebe4}.user{align-self:flex-end;background:#dbf5e6}.form{display:flex;gap:7px;padding:11px;background:white;border-top:1px solid #e5eee8;flex-shrink:0}.form[hidden]{display:none}.form input{flex:1;min-width:0;border:1px solid #d1e2d8;padding:11px;border-radius:8px;font:inherit}.form button{border:0;background:#07a777;border-radius:8px;color:white;font-weight:750;padding:0 14px}.form button:disabled{opacity:.4}.foot{font-size:10px;text-align:center;color:#8da295;padding:8px;background:white}.lead-toggle{margin:0 11px 6px;padding:9px 12px;border:1px solid #bce7d7;background:#e8f8f0;color:#075b48;font:700 12px system-ui,sans-serif;border-radius:9px;text-align:center;cursor:pointer}.lead-form{display:none;background:#fff;padding:10px 12px 12px;border-top:1px solid #e5eee8;max-height:min(220px,35dvh);overflow-y:auto;flex:0 1 auto}.lead-form.open{display:block}.lead-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.lead-form input,.lead-form textarea{min-width:0;width:100%;padding:9px;border:1px solid #ccdcd3;border-radius:7px;font:12px system-ui,sans-serif}.lead-form textarea{grid-column:1/-1;resize:vertical;min-height:49px}.lead-form button{background:#078962;border:0;padding:10px;border-radius:8px;color:white;font-weight:700;cursor:pointer}.lead-form button:disabled{opacity:.5}.lead-status{font-size:11px;line-height:1.4;margin:6px 0}.hp{position:absolute;left:-10000px}

/* Compact animated AI thinking indicator, matching SmartStore. */
.thinking-bubble{display:inline-flex;align-items:center;gap:8px;min-height:32px}
.thinking-dots{display:inline-flex;align-items:center;gap:4px;height:12px}
.thinking-dots i{display:block;width:5px;height:5px;border-radius:50%;background:#087657;animation:thinking-pulse 1s ease-in-out infinite}
.thinking-dots i:nth-child(2){animation-delay:.16s}
.thinking-dots i:nth-child(3){animation-delay:.32s}
.thinking-label{font-size:11px;color:#668b77}
@keyframes thinking-pulse{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.thinking-dots i{animation:none;opacity:.7}}
/* Each message must grow to fit its complete text; only the transcript scrolls. */
#feed>.bubble{flex-shrink:0;max-height:none;position:relative;z-index:0}
#feed>.thinking-bubble{width:max-content;max-width:90%}

.widget-support-button{display:block;width:calc(100% - 22px);margin:8px 11px 4px;padding:11px 12px;border:0;border-radius:10px;background:#087858;color:#fff;font:800 13px system-ui,sans-serif;cursor:pointer;min-height:44px}.widget-support-button:focus-visible{outline:3px solid #28bd91;outline-offset:2px}.widget-support-button[hidden]{display:none!important}</style></head><body><header class="head"><span id="business">Business assistant</span><small id="status">Connecting securely…</small></header><main class="feed" id="feed" role="log" aria-live="polite"><div class="bubble bot" id="hello">Checking this assistant…</div></main>
<form class="form" id="form"><input id="message" required maxlength="700" placeholder="Ask about products or services…" disabled autocomplete="off"><button id="send" disabled>Send</button></form><button class="widget-support-button" id="contactSupport" type="button" data-nexus-support aria-haspopup="dialog" hidden>Contact Support</button><button class="lead-toggle" id="leadToggle" type="button" aria-expanded="false" aria-controls="leadForm" disabled>Leave your contact details</button><form id="leadForm" class="lead-form" aria-label="Business inquiry"><div class="lead-grid"><input id="leadName" name="name" placeholder="Your name" autocomplete="name" required minlength="2" maxlength="100"><input id="leadEmail" name="email" placeholder="Email address" type="email" autocomplete="email" maxlength="180"><input id="leadPhone" name="phone" placeholder="Phone (or email)" type="tel" autocomplete="tel" maxlength="35"><select id="leadType" style="grid-column:1/-1;border:1px solid #ccdcd3;border-radius:7px;padding:9px"><option value="information">Request information</option><option value="appointment">Request appointment</option><option value="callback">Request callback</option><option value="quote">Request quote</option></select><input id="leadTime" maxlength="120" placeholder="Preferred appointment date/time (optional)" style="grid-column:1/-1;display:none"><textarea id="leadInterest" name="interest" placeholder="What can we help you with?" required minlength="5" maxlength="1500"></textarea></div><input id="leadHp" class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><p id="leadStatus" class="lead-status" role="status" aria-live="polite"></p><button type="submit" id="leadSend">Send inquiry</button></form><div class="foot">Chats may be saved and shared with this business if you submit an inquiry. Appointments are requests, not confirmed bookings.</div>
<script src="/nexus-support.js" defer></script>
<script>
const botId=new URLSearchParams(location.search).get("bot")||"";
const el=id=>document.getElementById(id),feed=el("feed");let ready=false,history=[],busy=false,storeSlug="",sessionId=null,chatClosed=false,remaining=10;
const sessionKey="nexus_widget_"+botId;try{sessionId=localStorage.getItem(sessionKey)||null}catch{}
function ownerSessionToken(){
  // Same-origin Nexus dashboard iframe only; the server verifies the JWT and ownership.
  // Cross-origin embedded widgets do not receive any dashboard authentication token.
  try{
    if(window.top===window || window.top.location.origin!==location.origin)return "";
    const auth=JSON.parse(sessionStorage.getItem("nexus_owner_v1")||"null");
    if(!auth?.access_token || (auth.expires_at && Date.now()/1000>auth.expires_at-60))return "";
    return String(auth.access_token);
  }catch{return ""}
}
const signedOwnerToken=ownerSessionToken();
if(signedOwnerToken)sessionId=null;

function add(role,text){const b=document.createElement("div");b.className="bubble "+role;b.textContent=String(text).slice(0,2500);feed.appendChild(b);feed.scrollTop=feed.scrollHeight;return b}
async function init(){
 if(!/^bot_[a-z0-9]{20,50}$/.test(botId)){el("hello").textContent="Invalid assistant link.";el("status").textContent="Unavailable";return}
 try{
  const r=await fetch("/.netlify/functions/widget-config?botId="+encodeURIComponent(botId),{cache:"no-store"});
  const data=await r.json();if(!r.ok||data.available!==true)throw Error("Not active");
  storeSlug=data.slug||"";remaining=data.chatMaxMessages||10;el("leadType").querySelector("[value=appointment]").disabled=data.appointmentsEnabled===false;el("business").textContent=data.businessName||"Business assistant";
  el("status").textContent=data.chatReady===true?"Live AI • Products and services":"AI temporarily offline • Leave an inquiry";
  el("hello").textContent=data.chatReady===true?(data.greeting||"Hi! How can I help today?"):"Our AI is temporarily unavailable. You can leave your contact details below.";
  ready=data.chatReady===true;el("message").disabled=!ready;el("send").disabled=!ready;el("leadToggle").disabled=false;
 }catch{el("status").textContent="Currently unavailable";el("hello").textContent="This assistant is temporarily unavailable. Please contact the business directly."}
}
el("form").onsubmit=async e=>{
 e.preventDefault();if(!ready||busy||chatClosed)return;
 const message=el("message").value.trim();if(!message)return;
 busy=true;el("message").value="";el("message").disabled=true;el("send").disabled=true;
 add("user",message);const pending=add("bot","");
 pending.classList.add("thinking-bubble");
 pending.setAttribute("aria-label","One moment, Nexus AI is thinking");
 const dots=document.createElement("span");dots.className="thinking-dots";dots.setAttribute("aria-hidden","true");
 for(let i=0;i<3;i++)dots.appendChild(document.createElement("i"));
 const label=document.createElement("span");label.className="thinking-label";label.textContent="One moment…";
 pending.append(dots,label);
 try{
  const r=await fetch("/.netlify/functions/store-chat",{method:"POST",headers:{"Content-Type":"application/json",...(signedOwnerToken?{Authorization:"Bearer "+signedOwnerToken}:{})},body:JSON.stringify({botId,message,sessionId})});
  const data=await r.json().catch(()=>({}));if(!r.ok){if(data.limitReached){closeChat();pending.textContent="Your AI conversation limit has been reached. Contact Support using the button below, or leave an inquiry.";return}throw Error("Unavailable")}if(!data.reply)throw Error("Unavailable");
  pending.textContent=data.reply;if(data.sessionId){sessionId=data.sessionId;try{localStorage.setItem(sessionKey,sessionId)}catch{}}remaining=Number.isInteger(data.remaining)?data.remaining:remaining;el("status").textContent=data.unlimitedOwner===true?"Owner preview • No chat-message quota":remaining+" messages remaining";if(data.limitReached)closeChat();history.push({role:"user",content:message},{role:"assistant",content:data.reply});history=history.slice(-8);
 }catch{pending.textContent="I can't answer right now. Please contact the business directly."}
 finally{busy=false;el("message").disabled=!ready||chatClosed;el("send").disabled=!ready||chatClosed;el("message").focus();feed.scrollTop=feed.scrollHeight}
};
function closeChat(){chatClosed=true;el("message").disabled=true;el("send").disabled=true;el("form").hidden=true;el("status").textContent="Chat limit reached · Contact Support";el("contactSupport").hidden=false;el("leadForm").classList.remove("open");el("leadToggle").setAttribute("aria-expanded","false");el("leadToggle").textContent="Leave your contact details";feed.scrollTop=feed.scrollHeight}
el("leadType").onchange=()=>{el("leadTime").style.display=el("leadType").value==="appointment"?"block":"none"};
el("leadToggle").onclick=()=>{const form=el("leadForm");const open=!form.classList.contains("open");form.classList.toggle("open",open);el("leadToggle").setAttribute("aria-expanded",String(open));el("leadToggle").textContent=open?"Hide contact form":"Leave your contact details"};
el("leadForm").onsubmit=async event=>{
 event.preventDefault();
 const button=el("leadSend");
 if(button.disabled||!storeSlug)return;
 button.disabled=true;el("leadStatus").textContent="Saving your inquiry…";
 try{
  const payload={slug:storeSlug,sessionId,requestType:el("leadType").value,preferredTime:el("leadTime").value,name:el("leadName").value.trim(),email:el("leadEmail").value.trim(),phone:el("leadPhone").value.trim(),interest:el("leadInterest").value.trim(),honeypot:el("leadHp").value};
  if(!payload.email&&!payload.phone)throw Error("Please enter an email or phone number");
  const response=await fetch("/api/store-inquiry",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),cache:"no-store"});
  const data=await response.json().catch(()=>({}));
  if(response.status!==201||data.accepted!==true)throw Error(data.error||"Unable to send inquiry");
  el("leadStatus").textContent="Inquiry received! The business can now follow up.";
  el("leadForm").reset();
 }catch(error){el("leadStatus").textContent=error.message||"Could not save your inquiry. Please retry."}
 finally{button.disabled=false}
};
init();
</script></body></html>
