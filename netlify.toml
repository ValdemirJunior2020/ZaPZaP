[build]
  publish = "public"
  command = "npm run test:ci && node scripts/build-vercel.mjs"
  environment = { NODE_VERSION = "22", SECRETS_SCAN_OMIT_KEYS = "NEXUS_OLLAMA_MODEL,NEXUS_SUPABASE_URL,PAYPAL_BUSINESS_PLAN_ID,PAYPAL_EXTRA_EMPLOYEE_GLOBAL_PLAN_ID,PAYPAL_PERSONAL_BASIC_PLAN_ID,PAYPAL_EXTRA_EMPLOYEE_BR_PLAN_ID,PAYPAL_WIDGET_ADDON_PLAN_ID" }

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Route application /api endpoints to Netlify Functions.
# The local server already supports /api paths; Netlify needs an explicit rewrite.
[[redirects]]
  from = "/api/:function"
  to = "/.netlify/functions/:function"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true

[[headers]]
  for = "/admin*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https://*.supabase.co; form-action 'self'; base-uri 'none'; frame-ancestors 'none'"

[[redirects]]
  from = "/s/:slug"
  to = "/store.html"
  status = 200
  force = true

[[headers]]
  for = "/s/*"
  [headers.values]
    Cache-Control = "no-store"

# The public business widget must be embeddable on customers' websites.
[[headers]]
  for = "/widget-chat.html"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; connect-src 'self'; img-src 'self' data: https:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-ancestors https: http:; object-src 'none'"

# Administrative and owner pages must not be embedded elsewhere.
[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
[[headers]]
  for = "/business.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
[[headers]]
  for = "/account.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"

# Harden production business UI and public storefronts
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
[[headers]]
  for = "/store.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
[[headers]]
  for = "/s/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
