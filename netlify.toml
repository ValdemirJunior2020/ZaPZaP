[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true

[[headers]]
  for = "/admin*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'"

[[redirects]]
  from = "/s/:slug"
  to = "/store.html"
  status = 200
  force = true

[[headers]]
  for = "/s/*"
  [headers.values]
    Cache-Control = "no-store"

# The public business widget must be embeddable on customers' websites.
[[headers]]
  for = "/widget-chat.html"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "frame-ancestors https: http:"

# Administrative and owner pages must not be embedded elsewhere.
[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
[[headers]]
  for = "/business.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
[[headers]]
  for = "/account.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
