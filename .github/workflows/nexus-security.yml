name: NexusSales security and tenant integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and tenant security integration tests
        run: npm run test:ci
      - name: Check no public WhatsApp OpenAI path
        shell: bash
        run: |
          if grep -En 'OPENAI_API_KEY|api\.openai\.com|OpenAI\(' netlify/functions/whatsapp.mjs netlify/functions/store-chat.mjs netlify/lib/ollama.mjs; then
            echo "Forbidden alternative AI provider found in NexusSales production chat."
            exit 1
          fi
