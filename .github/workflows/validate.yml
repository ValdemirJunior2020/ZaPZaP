name: Validate ZaPZaP demo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: HTTP smoke test
        run: |
          node server.mjs > /tmp/zapzap.log 2>&1 &
          sleep 2
          curl --fail http://localhost:8788/
          curl --fail http://localhost:8788/api/health
